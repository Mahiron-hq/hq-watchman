[package]
name = "hq-watchman"
version = "0.1.3"
edition = "2021"
rust-version = "1.99"
description = "Telegram bot that notifies its owner about GitHub, Steam guide and Steam game events"
authors = ["Lev Burmistrov (Mahiron-hq)"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Mahiron-hq/hq-watchman"
publish = false

[dependencies]
anyhow = "1.0.105"
base64 = "0.22.1"
bytes = "1.12.2"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1.5"
hyper = { version = "1.13.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "server", "tokio"] }
ipnet = "2.12.2"
jiff = { version = "1.0.3", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
prost = { version = "0.14.6", default-features = false, features = ["derive", "std"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "multipart", "form", "query"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
scraper = { version = "0.29.0", default-features = false }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-util = "0.7.20"
toml = { version = "1.2.2", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std", "ansi"] }
zeroize = "1.9.2"

[dev-dependencies]
proptest = "1.12.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
