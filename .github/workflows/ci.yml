name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: No unsafe and no OpenSSL
        run: |
          if grep -rnw "unsafe" src --include=*.rs; then exit 1; fi
          for c in openssl-sys native-tls aws-lc-sys; do
            if cargo tree --locked -e normal -i "$c" >/dev/null 2>&1; then echo "$c found"; exit 1; fi
          done

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --locked

  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  image:
    runs-on: ubuntu-24.04
    needs: [check, deny]
    env:
      TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Version
        id: v
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: hq-watchman:${{ steps.v.outputs.version }}
          build-args: HQW_COMMIT=${{ github.sha }}
      - name: Image has no shell and runs as non-root
        run: |
          test "$(docker image inspect hq-watchman:${{ steps.v.outputs.version }} --format '{{.Config.User}}')" = "65532:65532"
          if docker run --rm --entrypoint /bin/sh hq-watchman:${{ steps.v.outputs.version }} -c true 2>/dev/null; then echo "shell found"; exit 1; fi
          docker run --rm hq-watchman:${{ steps.v.outputs.version }} --version
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hq-watchman:${{ steps.v.outputs.version }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hq-watchman:${{ steps.v.outputs.version }}
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true
      - name: Export image
        run: |
          docker save hq-watchman:${{ steps.v.outputs.version }} | gzip -9 > hq-watchman-${{ steps.v.outputs.version }}-linux-amd64.tar.gz
          sha256sum hq-watchman-*.tar.gz sbom.cdx.json > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hq-watchman-image
          path: |
            hq-watchman-*.tar.gz
            sbom.cdx.json
            SHA256SUMS.txt
          retention-days: 30
